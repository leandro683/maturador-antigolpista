# Maturador + Anti-golpista: stack de produção (Docker Compose, um host).
# Uso:
#   cp .env.example .env          # preencha os valores (nunca commite o .env)
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --build   # o --env-file .env é obrigatório
# Painel: http://127.0.0.1:3100 (porta `WEB_PORT`). A porta é publicada só em localhost; para acesso pela internet, ponha um proxy reverso com TLS na frente.
# Redes: `backend` (interna) tem Postgres e Redis, só para migrate, web e worker. `waha_net` (interna) liga o WAHA ao web e ao worker.
# O WAHA (imagem de terceiros) não enxerga Postgres nem Redis. `egress` dá saída para a internet (WhatsApp, OpenRouter).
# O WAHA não publica porta. Para depurar no host: docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.waha-debug.yml up -d
# Este sistema cria uma sessão do WAHA por chip (`mag_<8 hex>`) e o maturador precisa de pelo menos dois chips. Quantas
# sessões simultâneas o WAHA aceita depende da edição e da versão da imagem (WAHA_IMAGE); confira na documentação do WAHA.
name: maturador-antigolpista

x-waha-env: &waha-env
  WAHA_API_KEY: ${WAHA_API_KEY:?defina WAHA_API_KEY no .env}
  WHATSAPP_API_KEY_EXCLUDE_PATH: ping,health
  WAHA_DASHBOARD_ENABLED: "false"
  WHATSAPP_SWAGGER_ENABLED: "false"
  WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-GOWS}
  WAHA_PRINT_QR: "False"
  WAHA_WORKER_ID: mag-waha-1
  WHATSAPP_RESTART_ALL_SESSIONS: "True"
  # nada neste sistema lê as mídias recebidas: não baixar (senão o disco enche com fotos e vídeos dos grupos)
  WHATSAPP_DOWNLOAD_MEDIA: "false"
  # webhook do WAHA para o painel (rede interna), assinado com HMAC
  WHATSAPP_HOOK_URL: http://web:3100/api/wa/events
  WHATSAPP_HOOK_EVENTS: session.status,message,message.ack,message.ack.group,message.reaction,group.v2.join,group.v2.leave,group.v2.participants,group.v2.participants.join-request,group.v2.update,poll.vote
  WHATSAPP_HOOK_HMAC_KEY: ${WAHA_HOOK_HMAC_KEY:?defina WAHA_HOOK_HMAC_KEY no .env}
  WHATSAPP_HOOK_RETRIES_POLICY: exponential
  WHATSAPP_HOOK_RETRIES_DELAY_SECONDS: "2"
  WHATSAPP_HOOK_RETRIES_ATTEMPTS: "5"
  TZ: America/Sao_Paulo

# `:?` (e não `?`) recusa também valor vazio: segredo em branco não sobe.
# Cada serviço recebe só o que usa: o migrate só o banco; o worker não recebe os segredos do painel.
x-db-env: &db-env
  NODE_ENV: production
  TZ: America/Sao_Paulo
  # nomes de serviço da rede backend; a senha do Postgres não pode ter @ : / ? #
  DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/postgres

x-worker-env: &worker-env
  <<: *db-env
  APP_URL: ${APP_URL:-http://localhost:3100}
  APP_TZ: ${APP_TZ:-America/Sao_Paulo}
  REDIS_URL: redis://redis:6379
  WAHA_URL: http://waha:3000
  WAHA_API_KEY: ${WAHA_API_KEY:?defina WAHA_API_KEY no .env}
  WA_FAKE_ENGINE: ""
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_API_KEY_MATURADOR: ${OPENROUTER_API_KEY_MATURADOR:-}
  LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-}

x-web-env: &web-env
  <<: *worker-env
  WAHA_HOOK_HMAC_KEY: ${WAHA_HOOK_HMAC_KEY:?defina WAHA_HOOK_HMAC_KEY no .env}
  AUTH_MODE: ${AUTH_MODE:-password}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  # o Compose não sabe exigir só com AUTH_MODE=password: fica obrigatório; no modo supabase use qualquer valor de 32+ caracteres
  SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no .env}
  TRUST_PROXY: ${TRUST_PROXY:-}
  NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:gows}
    restart: always
    environment: *waha-env
    volumes:
      - waha_sessions:/app/.sessions
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [waha_net, egress]
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]
    logging: *logging

  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]
    logging: *logging

  # roda as migrações do schema `mag` e sai; web e worker só sobem depois disso
  migrate:
    build: &app-build
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: ${WORKER_IMAGE:-mag/worker:latest}
    restart: "no"
    working_dir: /repo/packages/db
    # direto no node: sem pnpm/corepack em tempo de execução (o usuário `app` não tem rede nem cache do corepack)
    command: ["node", "--import", "tsx", "src/migrate.ts"]
    environment: *db-env
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    image: ${WEB_IMAGE:-mag/web:latest}
    restart: always
    environment: *web-env
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3100"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      waha: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/login',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [backend, waha_net, egress]
    logging: *logging

  worker:
    build: *app-build
    image: ${WORKER_IMAGE:-mag/worker:latest}
    restart: always
    # o worker espera os jobs ativos ao parar; sem essa folga o docker mata o processo em 10 s no meio de um envio
    stop_grace_period: 30s
    environment: *worker-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      waha: { condition: service_healthy }
    networks: [backend, waha_net, egress]
    logging: *logging

volumes:
  waha_sessions:
  redis_data:
  postgres_data:

networks:
  # sem saída para a internet: postgres e redis ficam aqui (e só migrate, web e worker entram)
  backend:
    internal: true
  # o WAHA fala só com web e worker por aqui; sem saída própria (a saída do WAHA é a `egress`)
  waha_net:
    internal: true
  # saída para a internet: WAHA (WhatsApp), web e worker (OpenRouter)
  egress: {}
